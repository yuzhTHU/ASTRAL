# Merge into the TLS server(s) for astral.thuai4s.ai and astrodiscovery.thuai4s.ai.
# TLS certificates and the public listener remain managed on the upstream server.
# The origin 172.16.96.14 is the private address of 39.106.223.114.
location / {
    proxy_pass http://172.16.96.14:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
