# Loaded inside nginx's http context. ASTRAL is published on loopback only;
# AgentEconomist retains its existing gateway-facing port with its own Host guard.
map $http_upgrade $astral_connection_upgrade {
    default upgrade;
    '' close;
}

# Web uses the canonical APP_ORIGIN for CSRF checks. Normalize only the explicitly
# approved HTTPS alias; pass all other origins unchanged so Web still rejects them.
map $http_origin $astral_backend_origin {
    default $http_origin;
    "https://astrodiscovery.thuai4s.ai" "https://astral.thuai4s.ai";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 403;
}

server {
    listen 80;
    listen [::]:80;
    server_name astral.thuai4s.ai;

    # Uploads stream to Web and Harness instead of nginx request-body temp files.
    client_max_body_size 0;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $astral_backend_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Public TLS is terminated by the upstream nginx.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $astral_connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name agenteconomist.fiblab.net;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $astral_connection_upgrade;
        proxy_read_timeout 10800s;
        proxy_send_timeout 10800s;
        send_timeout 10800s;
    }
}
